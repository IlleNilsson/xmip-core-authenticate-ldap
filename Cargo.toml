[package]
name = "xmip-core-authenticate-ldap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-ldap"
description = "Authenticate by LDAP: proves a username and password by a simple bind at the directory, RFC 4511 inside TLS: StartTLS or LDAPS. A xmip-core-authenticate technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md), and on no sibling (ADR-0050 section 6). The
# mechanism catalog is xmip-core's and the verdict is xmip-core-context's.
authenticate = { workspace = true }
# identify for the principal name types: no technology parses a principal
# name itself (ADR-0054).
identify = { workspace = true }
xcore = { workspace = true }
context = { workspace = true }
# X.690: a bind is BER, read and written with the estate's one reader.
asn1 = { workspace = true }
# The one TCP connect: every address the directory's name resolves to,
# tried within the timeout.
net = { workspace = true }
# The TLS a bind travels inside, StartTLS or LDAPS: the estate's own.
tls = { workspace = true }

[dev-dependencies]
# The certificate the in-process directory serves TLS with.
rcgen = "0.14"
# A loopback address no one holds, for what a test wants nothing listening
# at or binds later (`net::fixture::unheld`).
net = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
